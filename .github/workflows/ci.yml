name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: parity + dispatch tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: typecheck
        run: npx tsc --noEmit
